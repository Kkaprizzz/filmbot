name: Deploy KinoBot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # Теперь используем пароль
          script: |
            cd /home/${{ secrets.SERVER_USER }}/filmbot || (mkdir -p /home/${{ secrets.SERVER_USER }}/filmbot && cd /home/${{ secrets.SERVER_USER }}/filmbot)
            git config --global --add safe.directory /home/${{ secrets.SERVER_USER }}/filmbot
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/Kkaprizzz/filmbot.git .
            fi
            docker-compose down
            docker-compose up -d --build
